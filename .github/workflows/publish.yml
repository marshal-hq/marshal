name: Publish Marshal release

# Publishes the Marshal fat-jar as a GitHub release asset. The composite action
# (marshal-action) downloads `marshal-cli-<version>.jar` from the release tagged
# `v<version>`, so the asset name and tag below are the contract the action relies on.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the leading v (e.g. 0.1.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: strip the leading v from refs/tags/vX.Y.Z
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shadow JAR
        run: ./gradlew :marshal-cli:shadowJar --no-daemon

      - name: Stage release asset
        run: |
          mkdir -p staging
          # The shadowJar carries no classifier; exclude the -thin (non-fat) jar.
          SHADOW=$(ls marshal-cli/build/libs/marshal-cli-*.jar | grep -v -- '-thin\.jar$')
          cp "${SHADOW}" "staging/marshal-cli-${{ steps.ver.outputs.version }}.jar"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: staging/marshal-cli-${{ steps.ver.outputs.version }}.jar
          fail_on_unmatched_files: true
