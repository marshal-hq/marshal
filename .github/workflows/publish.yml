name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build shadow JAR
        run: ./gradlew :marshal-cli:shadowJar --no-daemon

      - name: Copy JAR into action context
        run: |
          cp marshal-cli/build/libs/marshal-cli-*-SNAPSHOT.jar \
             marshal-action/marshal-cli.jar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: marshal-action
          push: true
          tags: ghcr.io/marshal-hq/marshal-action:${{ github.event.inputs.version }}

      - name: Clean up staging JAR
        if: always()
        run: rm -f marshal-action/marshal-cli.jar
