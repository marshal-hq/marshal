// marshal-init.gradle
//
// Injected by Marshal via --init-script. Registers a `marshalDeps` task on the
// root project that walks the resolved dependency graph of every subproject and
// writes the full external-module set — plus the graph's parent→child edges — to
// a JSON file: { "modules": [...], "edges": [...] }.
//
// Output path is passed by Marshal as a project property: -PmarshalOut=/abs/path.json
// Test scopes are included only when Marshal passes -PmarshalIncludeTest=true (S05).
//
// Emits the RESOLVED version (post conflict resolution) — i.e. what actually lands
// on the classpath. Project (module) components are skipped; only external modules
// reach Maven Central downstream. Edges are external-to-external only: a dependency
// declared in a sibling project shows up as a direct in that project's own
// resolution (allprojects loop), so project-component hops carry no information
// the introduced-by paths need.

import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentSelector

rootProject {
    tasks.register("marshalDeps") {
        doLast {
            def outPath = rootProject.findProperty("marshalOut")
            if (outPath == null) {
                throw new GradleException("marshalOut property not set")
            }

            def scopes = ["compileClasspath", "runtimeClasspath"]
            if (rootProject.findProperty("marshalIncludeTest") == "true") {
                scopes += ["testCompileClasspath", "testRuntimeClasspath"]
            }

            def modules = []
            def edges = [] as LinkedHashSet
            allprojects.each { proj ->
                scopes.each { cfgName ->
                    def cfg = proj.configurations.findByName(cfgName)
                    if (cfg == null || !cfg.canBeResolved) {
                        return
                    }
                    def rr = cfg.incoming.resolutionResult
                    def rootId = rr.root.id
                    def directIds = rr.root.dependencies.findAll {
                        it instanceof ResolvedDependencyResult
                    }.collect { it.selected.id } as Set

                    // Declared/transitive dependencies that could not be resolved are
                    // emitted with an UNRESOLVED sentinel rather than silently dropped —
                    // resolutionResult is lenient, so without this a missing dependency
                    // would vanish and false-clean (parity with the Maven UNRESOLVED path).
                    rr.allDependencies.each { dep ->
                        if (dep instanceof UnresolvedDependencyResult
                                && dep.attempted instanceof ModuleComponentSelector) {
                            def sel = dep.attempted
                            modules << [
                                group        : sel.group,
                                name         : sel.module,
                                version      : "UNRESOLVED",
                                configuration: cfgName,
                                project      : proj.path,
                                direct       : dep.from.id == rootId
                            ]
                        }
                    }

                    rr.allComponents.each { comp ->
                        // Skip project (module) components; keep external modules only.
                        if (comp.id instanceof ProjectComponentIdentifier) {
                            return
                        }
                        def mv = comp.moduleVersion
                        if (mv == null) {
                            return
                        }
                        modules << [
                            group        : mv.group,
                            name         : mv.name,
                            version      : mv.version,
                            configuration: cfgName,
                            project      : proj.path,
                            direct       : directIds.contains(comp.id)
                        ]
                        // Parent→child edges of the resolved graph, needed to attach
                        // introduced-by paths to findings downstream. Unresolved targets
                        // keep their edge too, so a transitive UNRESOLVED node still
                        // shows which direct dragged it in.
                        comp.dependencies.each { dep ->
                            // Constraint edges (a BOM/platform constraining a version) are
                            // not "X pulled in Y" — following them would fabricate paths
                            // through the BOM that the Maven side (correctly) never has.
                            if (dep.constraint) {
                                return
                            }
                            if (dep instanceof ResolvedDependencyResult
                                    && !(dep.selected.id instanceof ProjectComponentIdentifier)
                                    && dep.selected.moduleVersion != null) {
                                def to = dep.selected.moduleVersion
                                edges << [
                                    fromGroup: mv.group, fromName: mv.name,
                                    toGroup  : to.group, toName: to.name
                                ]
                            } else if (dep instanceof UnresolvedDependencyResult
                                    && dep.attempted instanceof ModuleComponentSelector) {
                                def to = dep.attempted
                                edges << [
                                    fromGroup: mv.group, fromName: mv.name,
                                    toGroup  : to.group, toName: to.module
                                ]
                            }
                        }
                    }
                }
            }
            def out = [modules: modules, edges: edges as List]
            new File(outPath as String).text = groovy.json.JsonOutput.toJson(out)
        }
    }
}
