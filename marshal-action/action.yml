name: 'Marshal Dependency Analysis'
description: 'Behavioral supply-chain security scanner for JVM dependencies'
author: 'Marshal (marshalhq.dev)'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  pom-path:
    description: 'Path to pom.xml'
    default: 'pom.xml'
  threshold:
    description: 'Risk level that fails the check (green/yellow/orange/red)'
    default: 'red'
  comment-on-pr:
    description: 'Post a risk summary comment on the PR'
    default: 'true'
  fail-on:
    description: 'Exit code behavior: fail, warn, never'
    default: 'fail'
  slack-webhook:
    description: 'Slack webhook URL for critical alerts'
    required: false

runs:
  using: 'docker'
  image: 'docker://ghcr.io/marshal-hq/marshal-action:0.1.0'
  env:
    INPUT_POM_PATH: ${{ inputs.pom-path }}
    INPUT_THRESHOLD: ${{ inputs.threshold }}
    INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
    INPUT_FAIL_ON: ${{ inputs.fail-on }}
    INPUT_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
