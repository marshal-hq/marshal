name: 'Marshal Dependency Security'
description: 'Behavioral security monitoring for software dependencies — detects supply-chain attacks via behavioral heuristics.'
author: 'Marshal Security'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  pom-path:
    description: 'Path to pom.xml or build.gradle relative to the repository root.'
    default: 'pom.xml'
  threshold:
    description: 'Minimum risk level that fails the check. One of: green, yellow, orange, red.'
    default: 'red'
  comment-on-pr:
    description: 'Post (or update) a risk summary comment on the pull request.'
    default: 'true'
  fail-on:
    description: 'Exit code behavior when threshold is breached. One of: fail, warn, never.'
    default: 'fail'
  slack-webhook:
    description: 'Slack incoming webhook URL. If provided, sends an alert when RED findings are detected.'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    INPUT_POM_PATH:      ${{ inputs.pom-path }}
    INPUT_THRESHOLD:     ${{ inputs.threshold }}
    INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
    INPUT_FAIL_ON:       ${{ inputs.fail-on }}
    INPUT_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
