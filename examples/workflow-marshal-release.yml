# Add this to your repo at .github/workflows/marshal.yml
name: Marshal

on:
  pull_request:
    paths:
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'

jobs:
  marshal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the PR base is built and diffed

      # Gradle projects only: provide the build toolchain for ./gradlew:
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: '17' }

      - name: Marshal scan
        uses: marshal-hq/marshal/marshal-action@v0.3.0
        with:
          path: '.'        # a build file or project dir (Maven or Gradle)
          threshold: red
          fail-on: fail
          marshal-version: '0.3.0'
