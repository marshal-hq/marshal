# Marshal Dependency Security — GitHub Actions workflow
#
# Add this file to your repository at:
#   .github/workflows/marshal.yml
#
# What it does:
#   • Runs on every PR that touches a Maven or Gradle build file
#   • Diffs the resolved dependency graph between the PR branch and its base
#   • Posts (or updates in place) a risk summary comment on the PR
#   • Fails CI on RED findings (configurable via `threshold` and `fail-on`)
#   • Optionally sends a Slack alert on RED findings
#
# Works for both Maven and Gradle: the action detects the build tool from `path`.
# For Gradle, the action runs ./gradlew on both the base and head trees, so the
# project's own build toolchain must be available on the runner — set it up BEFORE
# the Marshal step (see the setup-java step below).
#
# Prerequisites:
#   • actions/checkout with fetch-depth: 0 — required so the PR base can be built
#     and diffed. A shallow checkout (the default) cannot be compared and the action
#     will fail honestly telling you to set this.
#   • permissions: pull-requests: write (to post the comment), contents: read.

name: Marshal Security Scan

on:
  pull_request:
    paths:
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'

permissions:
  pull-requests: write   # post/update the PR comment
  contents: read         # checkout code

jobs:
  marshal:
    name: Dependency security scan
    runs-on: ubuntu-latest

    steps:
      # Full history so the PR base tree can be materialized and built.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle projects only: provision the project's build toolchain so ./gradlew
      # can resolve. Omit for Maven-only repos. The Marshal jar itself runs on a
      # separate Java 21 the action resolves on its own.
      - name: Set up build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Marshal scan
        uses: marshal-hq/marshal-action@v1
        with:
          # A build file or a project directory, relative to the repo root.
          # Maven: pom.xml. Gradle: the project dir (default '.') or build.gradle(.kts).
          path: '.'

          # Minimum risk level that fails CI: green | yellow | orange | red (default: red)
          threshold: red

          # Post a risk summary comment on the PR. Set 'false' for fork PRs without
          # write access.
          comment-on-pr: 'true'

          # Exit behavior when threshold is breached: fail | warn | never (default: fail).
          # Note: a could-not-analyze failure (exit 3) always fails the check regardless.
          fail-on: fail

          # Slack webhook for RED alerts (optional); store as a repository secret.
          # slack-webhook: ${{ secrets.MARSHAL_SLACK_WEBHOOK }}
